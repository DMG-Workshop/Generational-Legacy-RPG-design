name: Long runs

# Every night the autopilot plays whole dynasties for many generations, one starting race per job, and each run
# is held to the limits in data/game/budgets.json: how big the save grows, how long it takes to load, how long a
# generation takes to play, and whether the line carries on. See tools/long_run_check.gd. It does not run on pull
# requests (a run takes minutes); start it by hand from the Actions tab to check a change, with other seeds or
# generations if wanted.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds, as a range (1-3) or a list (1,5,9)"
        default: "1-2"
      gens:
        description: "Generations per dynasty"
        default: "60"

permissions:
  contents: read

jobs:
  races:
    name: List races
    runs-on: ubuntu-latest
    outputs:
      races: ${{ steps.list.outputs.races }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - id: list
        run: |
          list=$(godot --headless --path . -s res://tools/long_run_check.gd -- list-races | tail -n 1)
          echo "races=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  run:
    name: ${{ matrix.race }}
    needs: races
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        race: ${{ fromJson(needs.races.outputs.races) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Play the long run
        env:
          RACE: ${{ matrix.race }}
          SEEDS: ${{ inputs.seeds || '1-2' }}
          GENS: ${{ inputs.gens || '60' }}
        run: |
          set -o pipefail
          godot --headless --path . -s res://tools/long_run_check.gd -- "seeds=${SEEDS}" "gens=${GENS}" "races=${RACE}" check 2>&1 | tee long-run.log
          if grep -q 'SCRIPT ERROR' long-run.log; then
            echo "::error::The long run printed a script error."
            exit 1
          fi
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-run-${{ matrix.race }}
          path: long-run.log
